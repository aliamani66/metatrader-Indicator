            <div class="workspace-header">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button id="btnToggleSidebarHeader" onclick="toggleSidebar()" style="background:#0f172a;border:1px solid #334155;color:#38bdf8;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;box-shadow:0 2px 6px rgba(0,0,0,0.3);" title="تغییر وضعیت منوی کناری (تمام‌صفحه / منو)" onmouseover="this.style.borderColor='#38bdf8';this.style.background='#1e293b'" onmouseout="this.style.borderColor='#334155';this.style.background='#0f172a'">
                        <span id="btnToggleSidebarIcon">☰</span>
                        <span id="btnToggleSidebarText">منو</span>
                    </button>
                    <div>
                        <h1>🎯 سیستم جامع معاملاتی FlagPro</h1>
                        <div id="headerDateRange" style="margin-top:3px;color:#94a3b8;font-size:11.5px;">
                            بازه داده‌ها: <b id="headerMinDate">-</b> تا <b id="headerMaxDate">-</b> | حجم: <b>0.04 لات پلکانی</b>
                        </div>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:6px;background:#081420;border:1px solid #38bdf8;padding:4px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(56,189,248,0.15);">
                        <label for="symbolSelector" style="font-size:11.5px;color:#94a3b8;font-weight:bold;">🌍 نماد / جفت‌ارز:</label>
                        <select id="symbolSelector" onchange="switchDashboardSymbol(this.value)" style="background:#0f172a;border:1px solid #334155;color:#38bdf8;font-weight:bold;padding:4px 8px;border-radius:6px;font-size:12px;outline:none;cursor:pointer;">
                            <option value="GBPUSD" selected>GBPUSD (M1, M5) - کل: ۲۲۷ | سلاطین: ۲۰ معامله</option>
                            <option value="EURUSD">EURUSD (M1, M5)</option>
                        </select>
                    </div>
                    <button onclick="triggerCSVUploadClick()" style="background:linear-gradient(135deg, #064e3b, #059669);border:1px solid #34d399;color:#fff;padding:5px 12px;border-radius:8px;font-size:11.5px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;box-shadow:0 2px 8px rgba(16,185,129,0.3);" title="انتخاب مستقیم فایل CSV یا Drag & Drop فایل به داخل مرورگر (مسیر پوشه Files خودکار در کلیپ‌بورد کپی می‌شود)" onmouseover="this.style.background='#047857'" onmouseout="this.style.background='linear-gradient(135deg, #064e3b, #059669)'">
                        <span>📂</span>
                        <span>بارگذاری CSV نماد جدید...</span>
                    </button>
                    
                    <button id="btnValidationModal" onclick="openDataValidationModal()" style="background:linear-gradient(135deg, #1e1b4b, #312e81);border:1px solid #6366f1;color:#c7d2fe;padding:5px 12px;border-radius:8px;font-size:11.5px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;box-shadow:0 2px 8px rgba(99,102,241,0.3);" title="بررسی اعتبارسنجی و وضعیت همگام‌سازی تمام تب‌ها با فایل واردشده" onmouseover="this.style.background='#3730a3'" onmouseout="this.style.background='linear-gradient(135deg, #1e1b4b, #312e81)'">
                        <span>🔍</span>
                        <span>اعتبارسنجی داده‌ها</span>
                        <span id="headerValidationPill" style="background:#059669;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;">● ۱۰۰٪ همگام</span>
                    </button>

                    <button onclick="showMT5PathAlert()" style="background:#0f172a;border:1px solid #334155;color:#94a3b8;padding:5px 8px;border-radius:8px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:4px;" title="مشاهده آدرس ذخیره فایل‌ها در متاتریدر">
                        <span>📁</span>
                        <span>مسیر فایل‌ها</span>
                    </button>
                    <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVFileUpload(this)">
                    <span id="headerSymbolBadge" style="background:#081420;border:1px solid #1e3a5f;padding:4px 10px;border-radius:6px;font-size:11px;color:#38bdf8;">
                        GBPUSD (M1, M15, M5)
                    </span>
                </div>
            </div>
